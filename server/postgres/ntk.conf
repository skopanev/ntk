# ntk 0.5.0 — дроплет 2 GB RAM. Только отличия от умолчаний.

# Наружу не смотрим никогда: доступ к базе идёт только через ntk-api по localhost.
listen_addresses = 'localhost'
password_encryption = scram-sha-256

# Память под 2 GB
shared_buffers = 512MB
effective_cache_size = 1536MB
work_mem = 8MB
maintenance_work_mem = 128MB

# К базе подключается только API со своим пулом — сотня соединений с большим запасом.
max_connections = 100

# SSD
random_page_cost = 1.1
effective_io_concurrency = 200

# Чтобы медленное было видно, а не угадывалось
log_min_duration_statement = 500ms
log_checkpoints = on
log_lock_waits = on
